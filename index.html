<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Surfer - 3D Endless Runner Prototype</title>
    <!-- Tailwind CSS for UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #090a0f;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .neon-text-blue {
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.8), 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .neon-text-pink {
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.4);
        }
        .neon-box-blue {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.6);
        }
        .neon-box-pink {
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.2);
            border: 1px solid rgba(255, 0, 127, 0.6);
        }
        .hud-glass {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="w-full h-full text-white relative">

    <!-- Canvas Container -->
    <div id="canvas-container" class="w-full h-full absolute inset-0 z-0"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="w-full h-full absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 md:p-6">
        
        <!-- HUD Header -->
        <div id="hud" class="w-full max-w-4xl mx-auto flex justify-between items-center hud-glass rounded-2xl p-4 neon-box-blue opacity-0 transition-opacity duration-300">
            <!-- Score & Multiplier -->
            <div class="flex items-center space-x-4">
                <div>
                    <div class="text-xs uppercase tracking-wider text-cyan-400">Score</div>
                    <div id="score-val" class="text-2xl md:text-3xl font-extrabold neon-text-blue">0</div>
                </div>
                <div id="multiplier-badge" class="hidden bg-pink-600 text-white font-bold text-xs px-2 py-1 rounded-full animate-pulse">
                    2X MULTIPLIER
                </div>
            </div>

            <!-- Active Powerup Indicators -->
            <div id="powerup-bar" class="flex space-x-2">
                <!-- Dynamic active powerup timers inserted here -->
            </div>

            <!-- Coins & High Score -->
            <div class="flex items-center space-x-6 text-right">
                <div>
                    <div class="text-xs uppercase tracking-wider text-amber-400">Coins</div>
                    <div class="flex items-center justify-end space-x-1">
                        <span class="text-amber-400 font-bold">🪙</span>
                        <span id="coin-val" class="text-xl md:text-2xl font-bold text-amber-300">0</span>
                    </div>
                </div>
                <div class="hidden sm:block">
                    <div class="text-xs uppercase tracking-wider text-purple-400">Best</div>
                    <div id="highscore-val" class="text-xl md:text-2xl font-bold text-purple-300">0</div>
                </div>
            </div>
        </div>

        <!-- Touch Controls Guide (Mobile helper) -->
        <div id="touch-guide" class="text-center text-xs text-gray-400 mb-2 opacity-60 sm:hidden">
            Swipe Up: Jump | Swipe Down: Slide | Swipe Left/Right: Switch Lanes
        </div>
    </div>

    <!-- Start Menu Overlay -->
    <div id="start-menu" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md pointer-events-auto p-4 w-full h-full">
        <div class="max-w-md w-full hud-glass p-8 md:p-10 rounded-3xl neon-box-blue text-center shadow-2xl my-auto">
            <h1 class="text-4xl md:text-6xl font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-8 neon-text-blue">
                CYBER SURFER
            </h1>

            <button id="start-btn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black text-xl md:text-2xl rounded-2xl shadow-lg transform transition active:scale-95 cursor-pointer neon-box-blue">
                ИГРАТЬ
            </button>
        </div>
    </div>

    <!-- Game Over Menu Overlay -->
    <div id="game-over-menu" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md pointer-events-auto p-4 w-full h-full">
        <div class="max-w-md w-full hud-glass p-6 md:p-8 rounded-3xl neon-box-pink text-center shadow-2xl my-auto">
            <h2 class="text-3xl md:text-4xl font-black italic tracking-wider text-pink-500 mb-6 neon-text-pink">
                GAME OVER
            </h2>

            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gray-900/80 p-3 md:p-4 rounded-2xl border border-pink-900/40">
                    <div class="text-[10px] md:text-xs text-gray-400 uppercase">Счет</div>
                    <div id="final-score" class="text-2xl md:text-3xl font-extrabold text-cyan-400">0</div>
                </div>
                <div class="bg-gray-900/80 p-3 md:p-4 rounded-2xl border border-pink-900/40">
                    <div class="text-[10px] md:text-xs text-gray-400 uppercase">Собрано монет</div>
                    <div id="final-coins" class="text-2xl md:text-3xl font-extrabold text-amber-400">0</div>
                </div>
            </div>

            <div class="mb-5 bg-gray-900/40 p-3 rounded-xl border border-gray-800 flex justify-between items-center text-sm">
                <span class="text-purple-400 font-semibold">Рекорд:</span>
                <span id="final-highscore" class="font-bold text-white text-lg">0</span>
            </div>

            <button id="restart-btn" class="w-full py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white font-black text-lg md:text-xl rounded-2xl shadow-lg transform transition active:scale-95 cursor-pointer neon-box-pink">
                ПОПРОБОВАТЬ СНОВА
            </button>
        </div>
    </div>

    <script>
        /**
         * Web Audio Synthesizer for SFX
         */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playCoin() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }

            playJump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playSlide() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playPowerup() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(now + 0.35);
            }

            playCrash() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                // Noise buffer for crash
                const bufferSize = this.ctx.sampleRate * 0.4;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now);
                filter.frequency.exponentialRampToValueAtTime(50, now + 0.4);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }

        const sfx = new SoundFX();

        /**
         * Game Engine Configuration & Constants
         */
        const CONFIG = {
            LANES: [-3.2, 0, 3.2], // X coordinates of the 3 lanes
            INITIAL_SPEED: 28,
            MAX_SPEED: 65,
            ACCELERATION: 0.25,
            JUMP_FORCE: 14,
            GRAVITY: 38,
            SEGMENT_LENGTH: 80,
            VISIBLE_SEGMENTS: 6,
            POWERUP_DURATION: 8, // seconds
        };

        // Game State Variables
        let scene, camera, renderer;
        let playerGroup, playerBody, hoverBoard, jetpackMesh;
        let trackSegments = [];
        let activeObstacles = [];
        let activeCoins = [];
        let activePowerups = [];
        let particles = [];

        let isPlaying = false;
        let isGameOver = false;
        let score = 0;
        let coinsCollected = 0;
        let highScore = parseInt(localStorage.getItem('cyber_surfer_highscore') || '0');
        let currentSpeed = CONFIG.INITIAL_SPEED;
        let distanceTraveled = 0;

        // Player Motion States
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let targetX = CONFIG.LANES[1];
        let playerY = 0;
        let verticalVelocity = 0;
        let isJumping = false;
        let isSliding = false;
        let slideTimer = 0;

        // Active Powerups State
        let powerups = {
            magnet: 0,
            jetpack: 0,
            multiplier: 0
        };

        /**
         * Initialization & Setup
         */
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060810);
            scene.fog = new THREE.FogExp2(0x060810, 0.015);

            // Camera setup
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 4.5, 9);
            camera.lookAt(0, 2, -10);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            setupLights();

            // Player creation
            createPlayer();

            // Initial track creation
            for (let i = 0; i < CONFIG.VISIBLE_SEGMENTS; i++) {
                spawnSegment(-i * CONFIG.SEGMENT_LENGTH);
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupInput();

            // UI High Score Display
            document.getElementById('highscore-val').innerText = highScore;

            // Start animation loop
            clock = new THREE.Clock();
            requestAnimationFrame(animate);
        }

        let clock;

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x00ffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // Cyberpunk rim light
            const rimLight = new THREE.DirectionalLight(0xff007f, 0.6);
            rimLight.position.set(-20, 20, -30);
            scene.add(rimLight);
        }

        /**
         * Create Cyber Player Model
         */
        function createPlayer() {
            playerGroup = new THREE.Group();

            // Character torso/core using Cylinder + Spheres for broad Three.js r128 support
            const bodyGroup = new THREE.Group();
            
            const cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.8, 16);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0x111827,
                roughness: 0.3,
                metalness: 0.8
            });
            const cyl = new THREE.Mesh(cylGeo, bodyMat);
            cyl.position.y = 0.9;
            cyl.castShadow = true;
            bodyGroup.add(cyl);

            const sphereGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const topSphere = new THREE.Mesh(sphereGeo, bodyMat);
            topSphere.position.y = 1.3;
            topSphere.castShadow = true;
            bodyGroup.add(topSphere);

            const botSphere = new THREE.Mesh(sphereGeo, bodyMat);
            botSphere.position.y = 0.5;
            botSphere.castShadow = true;
            bodyGroup.add(botSphere);

            playerBody = bodyGroup;
            playerGroup.add(playerBody);

            // Glowing Cyber Helmet / Visor
            const visorGeo = new THREE.BoxGeometry(0.55, 0.3, 0.4);
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.45, -0.2);
            playerGroup.add(visor);

            // Hoverboard
            const boardGeo = new THREE.BoxGeometry(1.2, 0.15, 2.2);
            const boardMat = new THREE.MeshStandardMaterial({
                color: 0x1f2937,
                emissive: 0xff007f,
                emissiveIntensity: 0.4,
                roughness: 0.2
            });
            hoverBoard = new THREE.Mesh(boardGeo, boardMat);
            hoverBoard.position.y = 0.1;
            hoverBoard.castShadow = true;
            playerGroup.add(hoverBoard);

            // Hoverboard Neon Strip
            const stripGeo = new THREE.BoxGeometry(1.25, 0.05, 2.25);
            const stripMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.y = 0.1;
            playerGroup.add(strip);

            // Jetpack Attachment (hidden by default)
            const jetGeo = new THREE.BoxGeometry(0.8, 0.8, 0.4);
            const jetMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.9 });
            jetpackMesh = new THREE.Mesh(jetGeo, jetMat);
            jetpackMesh.position.set(0, 1.2, 0.45);
            jetpackMesh.visible = false;

            // Jetpack thruster glow
            const thrusterGeo = new THREE.CylinderGeometry(0.15, 0.05, 0.4);
            const thrusterMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const thrusterL = new THREE.Mesh(thrusterGeo, thrusterMat);
            const thrusterR = thrusterL.clone();
            thrusterL.position.set(-0.25, -0.4, 0);
            thrusterR.position.set(0.25, -0.4, 0);
            jetpackMesh.add(thrusterL);
            jetpackMesh.add(thrusterR);

            playerGroup.add(jetpackMesh);

            scene.add(playerGroup);
        }

        /**
         * Track & Environment Generation
         */
        function spawnSegment(zPos) {
            const segment = new THREE.Group();
            segment.position.z = zPos;

            // Ground Track Base
            const trackGeo = new THREE.BoxGeometry(12, 0.4, CONFIG.SEGMENT_LENGTH);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.8 });
            const trackMesh = new THREE.Mesh(trackGeo, trackMat);
            trackMesh.position.y = -0.2;
            trackMesh.receiveShadow = true;
            segment.add(trackMesh);

            // Glowing Lane Dividers
            const lineGeo = new THREE.BoxGeometry(0.15, 0.02, CONFIG.SEGMENT_LENGTH);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, opacity: 0.4, transparent: true });

            const line1 = new THREE.Mesh(lineGeo, lineMat);
            line1.position.set(-1.6, 0.01, 0);
            const line2 = line1.clone();
            line2.position.set(1.6, 0.01, 0);
            segment.add(line1, line2);

            // Side Glowing Rails
            const railGeo = new THREE.BoxGeometry(0.3, 0.6, CONFIG.SEGMENT_LENGTH);
            const railMat = new THREE.MeshStandardMaterial({ color: 0x111827, emissive: 0xff007f, emissiveIntensity: 0.3 });
            const railL = new THREE.Mesh(railGeo, railMat);
            railL.position.set(-6, 0.3, 0);
            const railR = railL.clone();
            railR.position.set(6, 0.3, 0);
            segment.add(railL, railR);

            // Procedural Cyberpunk Side Buildings/Structures
            for (let side of [-1, 1]) {
                const bldgHeight = 15 + Math.random() * 25;
                const bldgGeo = new THREE.BoxGeometry(10, bldgHeight, 20 + Math.random() * 20);
                const bldgMat = new THREE.MeshStandardMaterial({
                    color: 0x07090e,
                    roughness: 0.9,
                    metalness: 0.2
                });
                const bldg = new THREE.Mesh(bldgGeo, bldgMat);
                bldg.position.set(side * (12 + Math.random() * 5), bldgHeight / 2, (Math.random() - 0.5) * 40);
                segment.add(bldg);

                // Neon windows / accents
                const windowGeo = new THREE.PlaneGeometry(0.4, bldgHeight * 0.7);
                const windowMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0x00f3ff : 0xff007f, side: THREE.DoubleSide });
                const windowMesh = new THREE.Mesh(windowGeo, windowMat);
                windowMesh.position.set(side * (7.05 + Math.random() * 5), bldgHeight / 2, bldg.position.z);
                windowMesh.rotation.y = Math.PI / 2;
                segment.add(windowMesh);
            }

            scene.add(segment);
            trackSegments.push(segment);

            // Do not spawn obstacles on initial start area
            if (zPos < -CONFIG.SEGMENT_LENGTH) {
                spawnObstaclesAndCoins(zPos);
            }
        }

        /**
         * Obstacles, Coins & Powerups Spawner
         */
        function spawnObstaclesAndCoins(zPos) {
            const laneIndices = [0, 1, 2];

            // Decide obstacle distribution for this segment
            laneIndices.forEach(laneIdx => {
                const laneX = CONFIG.LANES[laneIdx];
                const rand = Math.random();

                if (rand < 0.45) { // Spawn Obstacle
                    const obsType = Math.random();
                    if (obsType < 0.4) {
                        // Low Hurdle (Jump over)
                        createHurdle(laneX, zPos + (Math.random() - 0.5) * 30);
                    } else if (obsType < 0.7) {
                        // High Barrier (Slide under)
                        createHighBarrier(laneX, zPos + (Math.random() - 0.5) * 30);
                    } else {
                        // Cyber Train / Blockade (Must dodge)
                        createTrain(laneX, zPos + (Math.random() - 0.5) * 20);
                    }
                } else if (rand < 0.8) { // Spawn Coin Line
                    spawnCoinLine(laneX, zPos + (Math.random() - 0.5) * 20, 4 + Math.floor(Math.random() * 4));
                } else if (rand < 0.86) { // Spawn Powerup
                    spawnPowerup(laneX, zPos + (Math.random() - 0.5) * 30);
                }
            });
        }

        function createHurdle(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const barGeo = new THREE.BoxGeometry(2.4, 0.4, 0.4);
            const barMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5 });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.y = 0.5;
            bar.castShadow = true;
            group.add(bar);

            const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 1);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x374151 });
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-1, 0.5, 0);
            const legR = legL.clone();
            legR.position.set(1, 0.5, 0);
            group.add(legL, legR);

            group.userData = { type: 'hurdle', bounds: { width: 2.4, height: 1.0, depth: 0.6 } };
            scene.add(group);
            activeObstacles.push(group);
        }

        function createHighBarrier(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const topGeo = new THREE.BoxGeometry(2.6, 1.2, 0.4);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00f3ff, emissiveIntensity: 0.4 });
            const topBar = new THREE.Mesh(topGeo, topMat);
            topBar.position.y = 2.4;
            topBar.castShadow = true;
            group.add(topBar);

            const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 3);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x4b5563 });
            const poleL = new THREE.Mesh(poleGeo, poleMat);
            poleL.position.set(-1.1, 1.5, 0);
            const poleR = poleL.clone();
            poleR.position.set(1.1, 1.5, 0);
            group.add(poleL, poleR);

            group.userData = { type: 'high_barrier', bounds: { width: 2.6, minY: 1.5, maxY: 3.2, depth: 0.6 } };
            scene.add(group);
            activeObstacles.push(group);
        }

        function createTrain(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const trainGeo = new THREE.BoxGeometry(2.6, 3.2, 14);
            const trainMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.4, metalness: 0.8 });
            const train = new THREE.Mesh(trainGeo, trainMat);
            train.position.y = 1.6;
            train.castShadow = true;
            group.add(train);

            // Front Lights
            const lightGeo = new THREE.CircleGeometry(0.35, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const lightL = new THREE.Mesh(lightGeo, lightMat);
            lightL.position.set(-0.8, 1.8, 7.01);
            const lightR = lightL.clone();
            lightR.position.set(0.8, 1.8, 7.01);
            group.add(lightL, lightR);

            group.userData = { type: 'train', bounds: { width: 2.6, height: 3.2, depth: 14 } };
            scene.add(group);
            activeObstacles.push(group);
        }

        function spawnCoinLine(x, startZ, count) {
            const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            coinGeo.rotateX(Math.PI / 2);
            const coinMat = new THREE.MeshStandardMaterial({
                color: 0xfacc15,
                metalness: 0.9,
                roughness: 0.1,
                emissive: 0xeab308,
                emissiveIntensity: 0.4
            });

            for (let i = 0; i < count; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set(x, 1.1, startZ - (i * 2.2));
                coin.castShadow = true;
                scene.add(coin);
                activeCoins.push(coin);
            }
        }

        function spawnPowerup(x, z) {
            const types = ['magnet', 'jetpack', 'multiplier'];
            const pType = types[Math.floor(Math.random() * types.length)];

            const group = new THREE.Group();
            group.position.set(x, 1.3, z);

            let color = 0x00f3ff;
            if (pType === 'magnet') color = 0xf59e0b;
            if (pType === 'multiplier') color = 0xff007f;

            const boxGeo = new THREE.OctahedronGeometry(0.6);
            const boxMat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.6,
                roughness: 0.2
            });
            const mesh = new THREE.Mesh(boxGeo, boxMat);
            group.add(mesh);

            group.userData = { type: pType };
            scene.add(group);
            activePowerups.push(group);
        }

        /**
         * Dynamic Particle FX
         */
        function createCollectParticles(pos, colorHex) {
            const particleCount = 12;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < particleCount; i++) {
                positions.push(pos.x, pos.y, pos.z);
                velocities.push(
                    (Math.random() - 0.5) * 6,
                    Math.random() * 6 + 2,
                    (Math.random() - 0.5) * 6
                );
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: colorHex,
                size: 0.25,
                transparent: true,
                opacity: 1
            });

            const pSystem = new THREE.Points(geom, mat);
            pSystem.userData = { velocities: velocities, life: 0.4 };
            scene.add(pSystem);
            particles.push(pSystem);
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.userData.life -= delta;

                if (p.userData.life <= 0) {
                    scene.remove(p);
                    p.geometry.dispose();
                    p.material.dispose();
                    particles.splice(i, 1);
                    continue;
                }

                const positions = p.geometry.attributes.position.array;
                const vels = p.userData.velocities;

                for (let j = 0; j < positions.length / 3; j++) {
                    positions[j * 3] += vels[j * 3] * delta;
                    positions[j * 3 + 1] += vels[j * 3 + 1] * delta;
                    positions[j * 3 + 2] += vels[j * 3 + 2] * delta;
                }
                p.geometry.attributes.position.needsUpdate = true;
                p.material.opacity = p.userData.life / 0.4;
            }
        }

        /**
         * Input Event Handling (Keyboard + Touch Swipes)
         */
        function setupInput() {
            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (!isPlaying || isGameOver) return;

                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                    changeLane(-1);
                } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                    changeLane(1);
                } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                    jump();
                } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                    slide();
                }
            });

            // Touch Swipe Controls
            let touchStartX = 0;
            let touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!isPlaying || isGameOver) return;

                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // Horizontal Swipe
                    if (Math.abs(diffX) > 30) {
                        if (diffX > 0) changeLane(1);
                        else changeLane(-1);
                    }
                } else {
                    // Vertical Swipe
                    if (Math.abs(diffY) > 30) {
                        if (diffY < 0) jump();
                        else slide();
                    }
                }
            }, { passive: true });

            // UI Buttons
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
        }

        function changeLane(direction) {
            const newLane = THREE.MathUtils.clamp(currentLane + direction, 0, 2);
            if (newLane !== currentLane) {
                currentLane = newLane;
                targetX = CONFIG.LANES[currentLane];
            }
        }

        function jump() {
            if (!isJumping && powerups.jetpack <= 0) {
                verticalVelocity = CONFIG.JUMP_FORCE;
                isJumping = true;
                sfx.playJump();
            }
        }

        function slide() {
            if (!isSliding && powerups.jetpack <= 0) {
                isSliding = true;
                slideTimer = 0.65; // Seconds
                if (isJumping) {
                    verticalVelocity = -20; // Fast drop if airborne
                }
                sfx.playSlide();
            }
        }

        /**
         * Main Game Loop & Logic Updates
         */
        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (isPlaying && !isGameOver) {
                updateGame(delta);
            }

            // Idle rotation for coins & powerups
            activeCoins.forEach(c => c.rotation.z += delta * 3);
            activePowerups.forEach(p => p.rotation.y += delta * 2);

            renderer.render(scene, camera);
        }

        function updateGame(delta) {
            // Speed progression
            currentSpeed = Math.min(CONFIG.MAX_SPEED, currentSpeed + CONFIG.ACCELERATION * delta);
            const moveDistance = currentSpeed * delta;
            distanceTraveled += moveDistance;

            // Score Calculation
            const mult = powerups.multiplier > 0 ? 2 : 1;
            score += Math.floor(moveDistance * mult);
            document.getElementById('score-val').innerText = score;

            // Update Powerup Durations
            updatePowerups(delta);

            // Handle Jetpack / Flying Height vs Normal Physics
            if (powerups.jetpack > 0) {
                playerY = THREE.MathUtils.lerp(playerY, 6.0, delta * 5);
                isJumping = false;
                isSliding = false;
            } else {
                // Vertical Gravity & Jump Mechanics
                if (isJumping || playerY > 0) {
                    playerY += verticalVelocity * delta;
                    verticalVelocity -= CONFIG.GRAVITY * delta;

                    if (playerY <= 0) {
                        playerY = 0;
                        isJumping = false;
                        verticalVelocity = 0;
                    }
                }

                // Slide Timer
                if (isSliding) {
                    slideTimer -= delta;
                    if (slideTimer <= 0) {
                        isSliding = false;
                    }
                }
            }

            // Smooth Horizontal Lane Switching
            playerGroup.position.x = THREE.MathUtils.lerp(playerGroup.position.x, targetX, delta * 18);
            playerGroup.position.y = playerY;

            // Player Animation Trait Adjustments (Scale & Tilt)
            if (isSliding) {
                playerBody.scale.set(1.2, 0.4, 1.2);
                playerBody.position.y = 0.4;
            } else {
                playerBody.scale.set(1, 1, 1);
                playerBody.position.y = 1.1;
            }

            // Smooth Roll tilt when switching lanes
            const xDiff = targetX - playerGroup.position.x;
            playerGroup.rotation.z = -xDiff * 0.08;

            // Move Track Segments backwards
            trackSegments.forEach(segment => {
                segment.position.z += moveDistance;
            });

            // Recalculate track loop / Infinite Generation
            if (trackSegments[0].position.z > CONFIG.SEGMENT_LENGTH) {
                const oldSeg = trackSegments.shift();
                const lastZ = trackSegments[trackSegments.length - 1].position.z;
                oldSeg.position.z = lastZ - CONFIG.SEGMENT_LENGTH;

                // Clear children in old segment except static base rail graphics
                scene.remove(oldSeg);
                spawnSegment(oldSeg.position.z);
            }

            // Move Obstacles, Coins, Powerups towards player
            updateEntities(moveDistance);

            // Collision Detections
            checkCollisions();

            // Particle Updates
            updateParticles(delta);

            // Dynamic Camera Follow
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x * 0.4, delta * 5);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, 4.5 + playerY * 0.5, delta * 5);
        }

        function updatePowerups(delta) {
            let activeUIHtml = '';

            for (let key in powerups) {
                if (powerups[key] > 0) {
                    powerups[key] -= delta;
                    const pct = Math.max(0, (powerups[key] / CONFIG.POWERUP_DURATION) * 100);
                    activeUIHtml += `
                        <div class="hud-glass px-2 py-1 rounded-lg border border-cyan-500/50 flex items-center space-x-1 text-xs">
                            <span class="uppercase font-bold text-cyan-300">${key[0]}</span>
                            <div class="w-12 bg-gray-800 rounded-full h-1.5 overflow-hidden">
                                <div class="bg-cyan-400 h-full" style="width: ${pct}%"></div>
                            </div>
                        </div>
                    `;
                }
            }

            jetpackMesh.visible = powerups.jetpack > 0;
            document.getElementById('multiplier-badge').style.display = powerups.multiplier > 0 ? 'block' : 'none';
            document.getElementById('powerup-bar').innerHTML = activeUIHtml;
        }

        function updateEntities(moveDistance) {
            // Move Obstacles
            for (let i = activeObstacles.length - 1; i >= 0; i--) {
                const obs = activeObstacles[i];
                obs.position.z += moveDistance;

                if (obs.position.z > 15) {
                    scene.remove(obs);
                    activeObstacles.splice(i, 1);
                }
            }

            // Move Coins & Handle Magnet Attraction
            for (let i = activeCoins.length - 1; i >= 0; i--) {
                const coin = activeCoins[i];
                coin.position.z += moveDistance;

                // Magnet Powerup Effect
                if (powerups.magnet > 0 && coin.position.z > -25 && coin.position.z < 5) {
                    coin.position.x = THREE.MathUtils.lerp(coin.position.x, playerGroup.position.x, 0.15);
                    coin.position.y = THREE.MathUtils.lerp(coin.position.y, playerGroup.position.y + 1, 0.15);
                }

                if (coin.position.z > 15) {
                    scene.remove(coin);
                    activeCoins.splice(i, 1);
                }
            }

            // Move Powerups
            for (let i = activePowerups.length - 1; i >= 0; i--) {
                const p = activePowerups[i];
                p.position.z += moveDistance;

                if (p.position.z > 15) {
                    scene.remove(p);
                    activePowerups.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            const pX = playerGroup.position.x;
            const pY = playerGroup.position.y;
            const playerZ = 0; // Fixed local Z plane

            // 1. Check Coins Collision
            for (let i = activeCoins.length - 1; i >= 0; i--) {
                const coin = activeCoins[i];
                const dist = Math.hypot(coin.position.x - pX, coin.position.y - (pY + 1), coin.position.z - playerZ);

                if (dist < 1.2) {
                    coinsCollected++;
                    score += 50;
                    document.getElementById('coin-val').innerText = coinsCollected;
                    sfx.playCoin();
                    createCollectParticles(coin.position, 0xfacc15);

                    scene.remove(coin);
                    activeCoins.splice(i, 1);
                }
            }

            // 2. Check Powerups Collision
            for (let i = activePowerups.length - 1; i >= 0; i--) {
                const p = activePowerups[i];
                const dist = Math.hypot(p.position.x - pX, p.position.y - (pY + 1), p.position.z - playerZ);

                if (dist < 1.4) {
                    const type = p.userData.type;
                    powerups[type] = CONFIG.POWERUP_DURATION;
                    sfx.playPowerup();
                    createCollectParticles(p.position, 0x00f3ff);

                    scene.remove(p);
                    activePowerups.splice(i, 1);
                }
            }

            // If jetpack active, immune to obstacles
            if (powerups.jetpack > 0) return;

            // 3. Check Obstacle Collisions
            for (let obs of activeObstacles) {
                const bounds = obs.userData.bounds;
                const obsX = obs.position.x;
                const obsZ = obs.position.z;

                // Depth check (Z overlap)
                const zOverlap = Math.abs(obsZ - playerZ) < (bounds.depth / 2 + 0.4);
                const xOverlap = Math.abs(obsX - pX) < (bounds.width / 2 + 0.3);

                if (zOverlap && xOverlap) {
                    let hit = false;

                    if (obs.userData.type === 'hurdle') {
                        // Collision if not jumped high enough
                        if (pY < bounds.height) hit = true;
                    } else if (obs.userData.type === 'high_barrier') {
                        // Collision if not sliding
                        if (!isSliding || pY > 0.5) hit = true;
                    } else if (obs.userData.type === 'train') {
                        // Solid train block
                        if (pY < bounds.height) hit = true;
                    }

                    if (hit) {
                        triggerGameOver();
                        break;
                    }
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            isPlaying = false;
            sfx.playCrash();

            // Save high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cyber_surfer_highscore', highScore.toString());
            }

            // Display Game Over Overlay
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-coins').innerText = coinsCollected;
            document.getElementById('final-highscore').innerText = highScore;
            document.getElementById('game-over-menu').classList.remove('hidden');
            document.getElementById('hud').classList.add('opacity-0');
        }

        function startGame() {
            sfx.init();
            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('opacity-0');
            resetGameState();
            isPlaying = true;
        }

        function restartGame() {
            sfx.init();
            document.getElementById('game-over-menu').classList.add('hidden');
            document.getElementById('hud').classList.remove('opacity-0');
            resetGameState();
            isPlaying = true;
        }

        function resetGameState() {
            // Clean active items
            activeObstacles.forEach(o => scene.remove(o));
            activeCoins.forEach(c => scene.remove(c));
            activePowerups.forEach(p => scene.remove(p));
            activeObstacles = [];
            activeCoins = [];
            activePowerups = [];

            // Reset status
            score = 0;
            coinsCollected = 0;
            currentSpeed = CONFIG.INITIAL_SPEED;
            distanceTraveled = 0;
            currentLane = 1;
            targetX = CONFIG.LANES[1];
            playerY = 0;
            verticalVelocity = 0;
            isJumping = false;
            isSliding = false;
            isGameOver = false;

            powerups = { magnet: 0, jetpack: 0, multiplier: 0 };

            playerGroup.position.set(targetX, 0, 0);

            document.getElementById('score-val').innerText = '0';
            document.getElementById('coin-val').innerText = '0';
            document.getElementById('highscore-val').innerText = highScore;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize on Load
        window.onload = init;
    </script>
</body>
</html>
